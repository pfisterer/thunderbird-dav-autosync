name: Release

# Push a tag vX.Y.Z whose version matches addon/manifest.json and has a section in CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag matches manifest version
        run: |
          VERSION=$(node -p "require('./addon/manifest.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME passt nicht zu manifest.json $VERSION"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Tests
        run: |
          scripts/nc-test.sh start
          eval "$(scripts/nc-test.sh env)"
          npm test
      - run: npm run lint
      - name: Build XPI, updates.json and checksums
        run: |
          npm run release
          # Unversioned copy for the stable URL releases/latest/download/dav-autosync.xpi
          cp "dist/dav-autosync-$VERSION.xpi" dist/dav-autosync.xpi
      - name: Build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/dav-autosync-${{ env.VERSION }}.xpi
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {p=1; next} p && /^## / {exit} p' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "Kein Abschnitt für $VERSION in CHANGELOG.md"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file dist/notes.md "dist/dav-autosync-$VERSION.xpi" dist/dav-autosync.xpi dist/updates.json dist/SHA256SUMS
